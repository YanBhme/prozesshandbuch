name: Windows build and storage tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test
        shell: powershell
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Prozesshandbuch-Windows
          path: dist/Prozesshandbuch-Windows.zip
