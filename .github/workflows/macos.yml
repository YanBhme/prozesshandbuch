name: macOS universal app and storage tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app and run tests
        run: bash macOS/build.sh
      - name: Launch smoke test
        run: |
          open -W macOS/build/Prozesshandbuch.app --args --capture "$PWD/macOS/build/Start.png"
          test -s macOS/build/Start.png
          open -W macOS/build/Prozesshandbuch.app --args --capture-guide --capture "$PWD/macOS/build/Anleitung.png"
          test -s macOS/build/Anleitung.png
      - uses: actions/upload-artifact@v4
        with:
          name: Prozesshandbuch-Mac
          path: |
            macOS/build/Prozesshandbuch-Mac.dmg
            macOS/build/Prozesshandbuch-Mac.zip
            macOS/build/Start.png
            macOS/build/Anleitung.png
          if-no-files-found: error
